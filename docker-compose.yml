name: museum-ar-tourism

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: museum_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - museum_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Mongo Express - Web-based MongoDB admin interface
  mongo-express:
    image: mongo-express
    container_name: museum_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - museum_network

  # Backend API
  backend:
    image: museum-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: museum_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - museum_network

  # Frontend - React/Vite (production build served by nginx)
  frontend:
    image: museum-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: museum_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - museum_network

  # YOLO Microservice - Object detection for AR
  yolo-service:
    image: museum-yolo
    build:
      context: ./yolo-service
      dockerfile: Dockerfile
    container_name: museum_yolo
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      CONFIDENCE_THRESHOLD: 0.5
      MODEL_DIR: /app/models
      CORS_ORIGINS: '["http://localhost","http://localhost:80"]'
    volumes:
      - yolo_models:/app/models
    networks:
      - museum_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Seed service - runs once to populate the database
  seed:
    image: museum-seed
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: museum_seed
    command: ["node", "seed.js"]
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - museum_network
    restart: "no"

volumes:
  mongodb_data:
  backend_uploads:
  yolo_models:

networks:
  museum_network:
    driver: bridge
